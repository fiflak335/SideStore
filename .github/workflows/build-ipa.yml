name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project SideloadDemo.xcodeproj \
            -scheme SideloadDemo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SideloadDemo.app Payload/
          zip -qr SideloadDemo.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideloadDemo.ipa
          path: SideloadDemo.ipa
